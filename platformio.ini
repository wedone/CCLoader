; PlatformIO 配置：CCLoader WebUI for ESP32-SOLO-1（单核）
; 烧录接线与 CCLib 完全一致（单 DD 线方案），监控模式下无需切换接线即可看 CC2530 日志
;
; ============ ESP32-SOLO-1 接线表（单核）============
;   IO5   -> CC Pin 7 (RESETn)        烧录用
;   IO4   -> CC Pin 3 (DC)            烧录用
;   IO12  -> CC Pin 4 (DD)            烧录用
;   IO16  -> CC P0_3   (UART0 TX)     监控/sniffer 用（Serial2 RX，U2RXD）
;   GND   -> CC Pin 1 (GND)
;   IO2   -> 板载 LED2（状态指示）
;   IO22  -> 板载 CH340C RXD（调试日志 TX，Serial 重映射）
;   IO23  -> 板载 CH340C TXD（调试日志 RX，Serial 重映射）
; 说明：ESP32-SOLO-1 开发板 USB-TTL 接在 IO22/IO23（非默认 IO1/IO3），
;       故 Serial 需重映射到 IO22/IO23 做调试输出；
;       CC2530 监控走 Serial2（IO16 RX），与调试串口物理分离，
;       监控/sniffer 模式下调试日志仍可正常输出（解决 ESP8266 时代 TX 影响 RX 的限制）。
;
; 无外部库依赖：SSE 用原生 WiFiServer（端口 81），JSON 用 String 手工拼接/解析。
;   - HTTP/Static: WebServer (80)
;   - 实时推送:    WiFiServer SSE   (81)  浏览器用 EventSource 连接
;
; 编译烧录：
;   python -m platformio run -t upload --upload-port COMx
;
; 上传 WebUI 静态文件到 LittleFS（首次或更新前端时执行）：
;   python -m platformio run -t uploadfs --upload-port COMx
;
; 串口监视器（查看启动 IP 等调试信息）：
;   python -m platformio device monitor -p COMx -b 115200

[platformio]
default_envs = esp32solo1

; ===== ESP32-SOLO-1 单核环境 =====
; 平台包：Tasmota platform-espressif32（arduino-esp32-solo 官方推荐迁移目标）
;   - 内置 board = esp32-solo1，extra_flags 自动加 -DCORE32SOLO1 单核编译开关
;   - Arduino 3.3.8 / IDF 5.5.4，比本地 arduino-esp32-solo 替换法更新且项目级隔离
[env:esp32solo1]
platform = https://github.com/tasmota/platform-espressif32/releases/download/2026.05.50/platform-espressif32.zip
board = esp32-solo1
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
build_flags =
    -DLED_BUILTIN=2
